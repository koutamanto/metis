# ─── 基本 ────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# ─── プレフィックスを Ctrl+a に ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── 分割は | と - (カレントディレクトリを引き継ぐ) ─────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── ペイン移動は vim キー / リサイズは大文字 ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── vi 風コピーモード ───────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ─── 設定リロード ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "設定をリロードしました"

# ─── 見た目 (Tokyo Night) ────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-left-length 30
set -g status-right "#[fg=#e0af68]#(~/.claude/bin/tmux-waiting)#[fg=#565f89]#{?client_prefix,#[fg=#f7768e]● ,}#[fg=#7dcfff]%Y-%m-%d #[fg=#bb9af7]%H:%M "
set -g status-interval 3
set -g status-right-length 60
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#7dcfff,bold] #I:#W#{?window_zoomed_flag, ,} "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
